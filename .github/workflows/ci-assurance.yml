name: ci-assurance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  coverage:
    # The literal job name "PR Coverage Gate / coverage" is required --
    # repo-standards-review's GATE:coverage:context rule looks for this
    # exact text.
    name: PR Coverage Gate / coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Install Test Dependencies
        shell: bash
        run: python -m pip install --upgrade pip pytest pytest-cov pyyaml

      - name: Run Tests With Coverage
        shell: bash
        # Scoped to scripts/, the only directory with real, assertion-based
        # unit tests today (Convert-VipbJson.py). This repo's VM-provisioning
        # and pipeline scripts need a live VM/VIPM toolchain to exercise
        # meaningfully and are validated via real CI dispatch instead (see
        # docs/requirements/srs.md REQ-008/REQ-009) -- `--cov=.` across the
        # whole repo would silently and misleadingly dilute this honest,
        # real percentage with files no test here could ever cover.
        run: |
          pytest scripts/tests/ --cov=scripts --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Enforce Coverage Threshold
        shell: bash
        run: |
          python - <<'PY'
          from xml.etree import ElementTree

          threshold = 90.0
          root = ElementTree.parse("coverage.xml").getroot()
          percent = float(root.attrib["line-rate"]) * 100.0
          print(f"Measured line coverage (scripts/): {percent:.1f}%")
          if percent < threshold:
              raise SystemExit(f"Coverage threshold failed: {percent:.1f}% < {threshold:.1f}%")
          PY

      - name: Upload Coverage Evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-evidence
          path: coverage.xml
