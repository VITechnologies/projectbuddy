name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to tag and release, e.g. v0.3.11 (must match a "## vX.Y.Z" heading in CHANGELOG.md).
        required: true
        type: string
      target:
        description: Branch or commit SHA to tag (normally "main", after a release/* branch has already been promoted there).
        required: false
        type: string
        default: main
      publish:
        description: Publish immediately instead of leaving it as a draft. Releases are immutable once published (tag/assets cannot change) -- defaults to draft so a human verifies first.
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Tag and Release ${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ inputs.target }}

      - name: Validate Version Format
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::-version must look like vX.Y.Z, got: $VERSION"
            exit 1
          fi
          # actions/checkout defaults to fetch-tags: false (confirmed live:
          # `git fetch --no-tags ...`), so a local `git rev-parse` here was
          # previously dead code -- it could never see a real remote tag.
          # Query the remote directly instead.
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists. Immutable releases do not allow tag reuse, even after deletion -- pick a new version."
            exit 1
          fi

      - name: Extract Matching CHANGELOG Section
        id: changelog
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Write to a file rather than a step output: CHANGELOG entries can
          # contain backticks, double quotes, and `$(...)` sequences, which
          # are unsafe to splice back into a later run: script's expression
          # syntax (a literal textual substitution, not a shell variable)
          # -- see CM-release.yml / CM-CI-Release-notes findings.
          notes="$(sed -n "/^## $VERSION/,/^## v/p" CHANGELOG.md | sed '$d' | tail -n +2)"
          if [ -z "$notes" ]; then
            echo "::error::No '## $VERSION' section found in CHANGELOG.md. Add the entry there first."
            exit 1
          fi
          printf '%s\n' "$notes" > /tmp/release-notes.md

      - name: Create Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.target }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          publish_flag=""
          if [ "$PUBLISH" != "true" ]; then
            publish_flag="--draft"
          fi
          gh release create "$VERSION" \
            --repo "${{ github.repository }}" \
            --target "$TARGET" \
            --title "$VERSION" \
            --notes-file /tmp/release-notes.md \
            $publish_flag
