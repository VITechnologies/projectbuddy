name: Toolchain Smoke Test

# Minimal, project-agnostic reusable workflow -- proves the
# VITechnologies/projectbuddy reusable-workflow consumption mechanism
# end-to-end (see README.md "Consumption model"). It has no side effects:
# it only reports tool presence/versions and fails if any requested tool
# is missing. Callers invoke this via:
#
#   uses: VITechnologies/projectbuddy/.github/workflows/toolchain-smoke-test.yml@<commit-sha> # <tag>
#
# pinned to a release commit SHA (tag documented as a trailing comment).
#
# NOTE: a reusable (workflow_call) workflow's default actions/checkout
# checks out the CALLER's repository, not this one -- github.repository
# resolves to the caller inside a called workflow's job, and GitHub Actions
# has no built-in context exposing "the ref this reusable workflow file was
# called at" for actions/checkout to default to. The caller must pass the
# exact same pinned ref it used in its own uses:@<ref> line back in as the
# projectbuddy-ref input below, so this workflow can check itself out
# explicitly (confirmed live 2026-11-04: omitting this silently checked out
# the caller's repository instead and failed to find this repo's scripts).

on:
  workflow_call:
    inputs:
      projectbuddy-ref:
        description: "The exact commit SHA this reusable workflow was called at (the same ref the caller's own uses:@<ref> line pins) -- required so this workflow can check out its own repository's files, not the caller's."
        required: true
        type: string
      projectbuddy-repository:
        description: "Repository containing the ProjectBuddy ref to test. Defaults to the upstream repository for normal consumers."
        required: false
        type: string
        default: VITechnologies/projectbuddy
      tool-names:
        description: "Comma-separated list of command names to check for on PATH (e.g. 'git,pwsh')."
        required: true
        type: string
      runs-on-json:
        description: "Runner label selector, JSON-encoded (e.g. '\"ubuntu-latest\"' or '[\"self-hosted\",\"windows\"]')."
        required: false
        type: string
        default: '"ubuntu-latest"'

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ${{ fromJSON(inputs.runs-on-json) }}
    steps:
      - name: Checkout ProjectBuddy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.projectbuddy-repository }}
          ref: ${{ inputs.projectbuddy-ref }}

      - name: Install PowerShell (if absent)
        shell: bash
        run: |
          if ! command -v pwsh >/dev/null 2>&1; then
            echo "pwsh not found; this reusable workflow requires a runner with PowerShell 7 available." >&2
            exit 1
          fi

      - name: Run Toolchain Presence Check
        shell: pwsh
        run: |
          $toolNames = '${{ inputs.tool-names }}' -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          ./scripts/Test-ToolchainPresence.ps1 -ToolNames $toolNames
