name: Standards Compliance Recheck

on:
  schedule:
    # Weekly: every Monday at 09:00 UTC.
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  recheck:
    name: Recheck repo-standards-review Version
    # svelderrainruiz/repo-standards-review is a private repo; no CI token
    # (not even a PAT) can read it reliably from a GitHub-hosted runner
    # without granting that token broad cross-repo access. Instead, this
    # runs on a self-hosted runner labeled "standards-review-local" whose
    # own ambient git/gh credentials already have real, working read access
    # -- the same model documented in
    # docs/architecture/standards-compliance.md for "anyone forking this
    # engine can register their own repo-standards-review instance and
    # runner this way."
    #
    # On a repo with no such runner registered (e.g. this engine's own
    # public upstream, which has no `standards-review-local`-labeled
    # runner -- though it does have a real, online `vm-provisioner`-
    # labeled runner for VM-provisioning workflows specifically; "zero
    # private infrastructure state" describes pre-committed configuration,
    # not every runner ever registered against it), this job will simply
    # queue and GitHub will
    # auto-fail it after its standard 24-hour no-runner timeout, once a
    # week -- expected, and not an error requiring action there.
    runs-on: [self-hosted, standards-review-local]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Required: actions/checkout's default persist-credentials: true
          # writes a local http.https://github.com/.extraheader override
          # into .git/config, scoped to the *host* (github.com), not just
          # this repo -- confirmed live, on this runner, to hijack every
          # subsequent https://github.com/... git operation in the job,
          # including the unrelated private repo-standards-review fetch
          # below, with the wrong, scope-less ephemeral job token (causing
          # a misleading "Repository not found"). This job never pushes
          # back to its own repo, so disabling persistence is safe.
          persist-credentials: false

      - name: Compare Stamped Version Against Latest
        id: compare
        shell: bash
        run: |
          set -euo pipefail

          stamp_file="docs/architecture/standards-compliance.md"
          stamped_tag=$(grep -o 'tag=[^ ]*' "$stamp_file" | head -1 | cut -d= -f2)
          stamped_sha=$(grep -o 'sha=[^ ]*' "$stamp_file" | head -1 | cut -d= -f2)

          # Relies on this runner's own ambient git/gh credentials (no
          # per-workflow token) to read the private repo-standards-review
          # repo, exactly as a local `git ls-remote`/`git clone` already
          # works unassisted on this host.
          latest_sha=$(git ls-remote --tags "https://github.com/svelderrainruiz/repo-standards-review.git" \
            | grep -v '\^{}$' | sort -t/ -k3 -V | tail -1 | cut -f1)
          latest_tag=$(git ls-remote --tags "https://github.com/svelderrainruiz/repo-standards-review.git" \
            | grep -v '\^{}$' | sort -t/ -k3 -V | tail -1 | sed 's#.*refs/tags/##')
          # Peeled (dereferenced) SHA is the actual commit for an annotated tag.
          peeled_sha=$(git ls-remote --tags "https://github.com/svelderrainruiz/repo-standards-review.git" "refs/tags/${latest_tag}^{}" | cut -f1)
          if [ -n "$peeled_sha" ]; then
            latest_sha="$peeled_sha"
          fi

          echo "Stamped: $stamped_tag ($stamped_sha)"
          echo "Latest:  $latest_tag ($latest_sha)"

          if [ "$stamped_tag" != "$latest_tag" ] || [ "$stamped_sha" != "$latest_sha" ]; then
            {
              echo "drift=true"
              echo "stamped_tag=$stamped_tag"
              echo "latest_tag=$latest_tag"
              echo "latest_sha=$latest_sha"
            } >> "$GITHUB_OUTPUT"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Flag Re-certification Due
        if: steps.compare.outputs.drift == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./New-HumanEscalation.ps1 `
            -Repo "${{ github.repository }}" `
            -EscalationId "standards-compliance-recheck-due" `
            -Title "repo-standards-review has a newer version: re-certification due" `
            -Context "docs/architecture/standards-compliance.md currently stamps svelderrainruiz/repo-standards-review@${{ steps.compare.outputs.stamped_tag }}, but the latest published version is ${{ steps.compare.outputs.latest_tag }} (${{ steps.compare.outputs.latest_sha }})." `
            -WhyAgentCannotResolve "Compliance could have regressed or the standard's requirements could have changed under the newer version; this is always a human review/decision, never an automated overwrite of the stamp." `
            -OptionsConsidered @("Re-run python3 scripts/run_assurance.py against this repo using the newer repo-standards-review version and review the result", "Defer re-certification to a later date if no urgent drift is suspected") `
            -Recommendation "Re-run the assurance pipeline against the newer version and update docs/architecture/standards-compliance.md's stamp (and gate table) only after reviewing the result." `
            -RelatedIssues @("docs/architecture/standards-compliance.md") `
            -Assignee "svelderrainruiz"
